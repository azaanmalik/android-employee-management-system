name: Android build and tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK Platform 34
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
      - name: Validate Android source is uploaded
        id: files
        shell: bash
        run: |
          if [ -f app/build.gradle.kts ] && [ -f gradlew ] && [ -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo 'source_present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'source_present=false' >> "$GITHUB_OUTPUT"
            echo 'Initial repository scaffold detected: Android source upload is pending.'
          fi
      - name: Build debug APK and run unit tests
        if: steps.files.outputs.source_present == 'true'
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest
